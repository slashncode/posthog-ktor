ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [io.github.slashncode.posthog.ktor.sample.ShopKt.module]
    }
}

# Without a project token PostHog stays off and the shop still works.
posthog {
    projectToken = ${?POSTHOG_PROJECT_TOKEN}
    host = "https://us.i.posthog.com"
    host = ${?POSTHOG_HOST}
    secretKey = ${?POSTHOG_SECRET_KEY}
}
