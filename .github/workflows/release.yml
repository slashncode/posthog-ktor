name: release

# A tag `v1.2.3` publishes 1.2.3 to Maven Central and releases it. A manual run uploads the given
# version and lets the Central Portal validate it (signature, POM, sources, javadoc) without
# releasing: the deployment waits on central.sonatype.com to be published or dropped by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to upload for validation, not released (e.g. 0.1.0-alpha01)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Publish
        id: publish
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
            task=publishAndReleaseToMavenCentral
          else
            version="$INPUT_VERSION"
            task=publishToMavenCentral
          fi
          echo "Publishing $version with $task"
          ./gradlew build "$task" -Pversion="$version" --no-configuration-cache | tee publish.log
          echo "deployment=$(sed -n 's/.*deployment id: \([0-9a-f-]*\).*/\1/p' publish.log | tail -1)" >> "$GITHUB_OUTPUT"
      # The plugin does not wait for Central's verdict on an upload it does not release: ask the
      # Publisher API until the deployment is VALIDATED or FAILED, then drop it either way.
      - name: Validate and drop (dry run)
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYMENT: ${{ steps.publish.outputs.deployment }}
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -o pipefail
          api=https://central.sonatype.com/api/v1/publisher
          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          state=UNKNOWN
          for _ in $(seq 1 60); do
            status=$(curl -fsS -X POST -H "Authorization: Bearer $token" "$api/status?id=$DEPLOYMENT")
            state=$(jq -r .deploymentState <<< "$status")
            echo "Deployment $DEPLOYMENT: $state"
            if [ "$state" = VALIDATED ] || [ "$state" = FAILED ]; then break; fi
            sleep 10
          done
          jq '.errors // {}' <<< "$status"
          curl -fsS -X DELETE -H "Authorization: Bearer $token" "$api/deployment/$DEPLOYMENT"
          echo "Dropped $DEPLOYMENT"
          [ "$state" = VALIDATED ]
